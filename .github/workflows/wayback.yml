name: Wayback collection

# Collects data from the Internet Archive on GitHub's runners (which can reach
# archive.org), since some environments block it by egress policy.
#
# - pull_request: proves the harvest works and uploads the inventory as an
#   artifact (no commit back).
# - workflow_dispatch / schedule: refreshes the inventory + archive cache and
#   commits the results to the branch.

on:
  workflow_dispatch:
    inputs:
      full:
        description: 'Force a complete, paginated re-scan (instead of incremental)'
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * 1' # weekly, Mondays 04:17 UTC
  pull_request:
    paths:
      - 'scripts/wayback-harvest.js'
      - 'scripts/archive-refs.js'
      - 'scripts/archive-country-sources.js'
      - '.github/workflows/wayback.yml'

permissions:
  contents: write

concurrency:
  group: wayback-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Harvest Wayback inventory (forodesaopaulo.org)
        run: node scripts/wayback-harvest.js ${{ (github.event_name == 'workflow_dispatch' && inputs.full) && '--full' || '' }} || echo "::warning::harvest step failed (archive.org unreachable?)"

      - name: Archive reference URLs
        run: node scripts/archive-refs.js || echo "::warning::archive step failed (archive.org unreachable?)"

      - name: Archive country-dossier source URLs
        run: node scripts/archive-country-sources.js || echo "::warning::country-source archive step failed (archive.org unreachable?)"

      - name: Fetch declaration bodies
        run: node scripts/fetch-declarations.js || echo "::warning::declaration fetch incomplete (archive.org unreachable or some snapshots failed)"

      - name: Extract declaration text corpus (#28)
        run: node scripts/extract-declarations.js || echo "::warning::declaration text extraction failed"

      - name: Preserve reference documents
        run: node scripts/archive-docs.js || echo "::warning::reference document archiving incomplete (archive.org unreachable or some fetches failed)"

      - name: Rebuild site
        run: node build.js

      - name: Job summary
        run: |
          echo "## Wayback collection" >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/wayback-inventory.json ]; then
            node -e "const d=require('./data/wayback-inventory.json'); console.log('- Unique archived URLs: **'+(d.uniqueUrls||0)+'**'); console.log('- High-value pages: **'+(d.usefulUrls||0)+'**'); console.log('- Latest capture: '+(d.latestCapture||'n/a')); console.log('- Last run: '+(d.lastRun||'n/a')); if(d.truncated) console.log('- ⚠️ scan truncated at page limit');" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No inventory produced (archive.org may be unreachable from this runner)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload inventory artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayback-inventory
          path: |
            data/wayback-inventory.json
            docs-research/wayback-inventory.md
          if-no-files-found: ignore

      - name: Commit results
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archives.json data/wayback-inventory.json data/declarations/ data/archive/ docs-research/ docs/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh Wayback inventory + archives [skip ci]"
            # master may have advanced while this run worked (e.g. a merge landed).
            # Rebase the generated-data commit onto the latest master and retry so
            # the push isn't lost to a non-fast-forward rejection.
            n=0
            until git push; do
              n=$((n+1))
              if [ "$n" -ge 4 ]; then echo "::error::push failed after $n attempts"; exit 1; fi
              echo "::warning::push rejected (master advanced) — rebasing on origin/master and retrying ($n)"
              git fetch origin master
              git rebase origin/master || { echo "::error::rebase conflict on generated data"; git rebase --abort; exit 1; }
            done
          fi
